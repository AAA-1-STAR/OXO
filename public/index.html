<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>可实时编辑的网页</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #3a6ea5;
      --line: #e2e2dd;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.8;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 72px; }
    header {
      border-bottom: 1px solid var(--line);
      padding-bottom: 20px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    h1 { font-size: 26px; font-weight: 700; }
    .toolbar { display: flex; gap: 10px; align-items: center; }
    button {
      font: inherit;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
    }
    button.ghost { background: #fff; color: var(--accent); }
    button:disabled { opacity: 0.5; cursor: default; }
    #view {
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 120px;
      color: var(--text);
    }
    #editor {
      width: 100%;
      min-height: 320px;
      font: inherit;
      line-height: 1.8;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      resize: vertical;
    }
    .status { color: var(--muted); font-size: 13px; min-height: 18px; }
    footer {
      border-top: 1px solid var(--line);
      margin-top: 48px;
      padding-top: 20px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>可实时编辑的网页</h1>
      <div class="toolbar">
        <span class="status" id="status"></span>
        <button id="editBtn">编辑</button>
      </div>
    </header>

    <div id="view"></div>

    <textarea id="editor" style="display:none"></textarea>
    <div class="toolbar" id="editActions" style="display:none; margin-top:16px;">
      <button id="saveBtn">保存</button>
      <button id="cancelBtn" class="ghost">取消</button>
    </div>

    <footer>内容实时保存并同步给所有访客 · 纯文本</footer>
  </div>

  <script>
    (function () {
      var view = document.getElementById('view');
      var editor = document.getElementById('editor');
      var editBtn = document.getElementById('editBtn');
      var saveBtn = document.getElementById('saveBtn');
      var cancelBtn = document.getElementById('cancelBtn');
      var editActions = document.getElementById('editActions');
      var status = document.getElementById('status');
      var current = '';

      function setStatus(t) { status.textContent = t; }

      function render(text) {
        // 关键：用 textContent 而非 innerHTML，防止存储型 XSS
        view.textContent = text;
      }

      function load() {
        return fetch('/api/content', { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (d.text !== current) {
              current = d.text;
              if (editor.style.display === 'none') render(current);
            }
            setStatus('已同步 · ' + new Date().toLocaleTimeString());
          })
          .catch(function () { setStatus('同步失败，重试中…'); });
      }

      editBtn.onclick = function () {
        load().then(function () {
          editor.value = current;
          view.style.display = 'none';
          editor.style.display = 'block';
          editActions.style.display = 'flex';
          editBtn.style.display = 'none';
          editor.focus();
        });
      };

      cancelBtn.onclick = function () {
        editor.style.display = 'none';
        view.style.display = 'block';
        editActions.style.display = 'none';
        editBtn.style.display = 'inline-block';
      };

      saveBtn.onclick = function () {
        saveBtn.disabled = true;
        setStatus('正在保存…');
        fetch('/api/content', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: editor.value })
        })
          .then(function (r) {
            if (r.ok) {
              current = editor.value;
              render(current);
              editor.style.display = 'none';
              view.style.display = 'block';
              editActions.style.display = 'none';
              editBtn.style.display = 'inline-block';
              setStatus('已保存 · ' + new Date().toLocaleTimeString());
            } else {
              setStatus('保存失败，请重试');
            }
          })
          .catch(function () { setStatus('保存失败，请重试'); })
          .then(function () { saveBtn.disabled = false; });
      };

      load();
      setInterval(load, 10000); // 每 10 秒轮询，访客自动同步最新内容
    })();
  </script>
</body>
</html>
